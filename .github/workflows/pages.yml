name: Deploy download page

# Redeploys the download page when only the page changed (release-apk.yml
# ignores these paths), so a new look does not cost a release and a push
# notification. The page is built for the newest release, with the checksum
# that release published.
on:
  push:
    branches: [main]
    paths:
      - '.github/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  APK_NAME: budget-tracker.apk

jobs:
  deploy:
    name: Deploy download page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build static site for the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y qrencode
          # Tags look like v1.3.0-build.16; the page shows 1.3.0.
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          PUBLISHED=$(gh release view --repo "$GITHUB_REPOSITORY" --json publishedAt -q .publishedAt)
          V="${TAG#v}"
          SHA256=$(gh release download --repo "$GITHUB_REPOSITORY" --pattern "$APK_NAME.sha256" --output - | awk '{print $1}')
          VERSION="${V%-build.*}" \
          SHA256="$SHA256" \
          DATE="$(date -u -d "$PUBLISHED" +%Y-%m-%d)" \
          DOWNLOAD_URL="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$APK_NAME" \
            bash .github/pages/build.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
