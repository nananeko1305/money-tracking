name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to publish a Release (contents) and deploy the download page (pages).
permissions:
  contents: write
  pages: write
  id-token: write

# Only one release run at a time; a newer push cancels an in-flight one.
concurrency:
  group: release-apk
  cancel-in-progress: true

env:
  APK_NAME: budget-tracker.apk
  FLUTTER_VERSION: 3.47.3

jobs:
  build:
    name: Build APK & publish Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Caches Gradle dependencies and build cache — the slowest part of the
      # Android build (Flutter SDK + pub are cached by flutter-action above).
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      # Quality gate: no release if analysis or tests fail.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Read app version
        id: ver
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "${{ env.APK_NAME }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-build.${{ github.run_number }}
          name: Money Tracking v${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          files: ${{ env.APK_NAME }}
          make_latest: true
          body: |
            Automatski build sa `main` grane.

            - Commit: ${{ github.sha }}
            - Build: #${{ github.run_number }}

            Skini `${{ env.APK_NAME }}` ispod i instaliraj na Android (dozvoli instalaciju iz nepoznatih izvora).

  deploy-pages:
    name: Deploy download page
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build static site
        run: |
          sudo apt-get update && sudo apt-get install -y qrencode
          DL="https://github.com/${{ github.repository }}/releases/latest/download/${{ env.APK_NAME }}"
          mkdir -p _site
          cp .github/pages/index.html _site/index.html
          qrencode -o _site/qr.png -s 8 -m 2 "$DL"
          sed -i \
            -e "s|__DOWNLOAD_URL__|$DL|g" \
            -e "s|__VERSION__|${{ needs.build.outputs.version }}|g" \
            -e "s|__BUILD__|${{ github.run_number }}|g" \
            -e "s|__DATE__|$(date -u +%Y-%m-%d)|g" \
            _site/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
